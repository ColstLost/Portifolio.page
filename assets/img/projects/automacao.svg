<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="autoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131a2a"/>
      <stop offset="100%" stop-color="#1b2436"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#autoBg)"/>
  <!-- fluxo de nós -->
  <line x1="90" y1="70" x2="180" y2="70" stroke="#3a4560" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="220" y1="70" x2="200" y2="130" stroke="#3a4560" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="220" y1="70" x2="310" y2="130" stroke="#3a4560" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="200" y1="170" x2="200" y2="205" stroke="#3a4560" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="310" y1="170" x2="310" y2="205" stroke="#3a4560" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- nó gatilho -->
  <g transform="translate(30,45)">
    <rect width="60" height="50" rx="10" fill="#0f1521" stroke="#4FD1C5" stroke-width="1.5"/>
    <path d="M30,14 l0,22 M20,25 l20,0" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="30" cy="25" r="12" fill="none" stroke="#4FD1C5" stroke-width="1.5"/>
  </g>
  <!-- nó engrenagem central -->
  <g transform="translate(180,45)">
    <rect width="60" height="50" rx="10" fill="#0f1521" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="30" cy="25" r="11" fill="none" stroke="#818CF8" stroke-width="2"/>
    <circle cx="30" cy="25" r="4" fill="#818CF8"/>
    <g stroke="#818CF8" stroke-width="2">
      <line x1="30" y1="10" x2="30" y2="14"/>
      <line x1="30" y1="36" x2="30" y2="40"/>
      <line x1="15" y1="25" x2="19" y2="25"/>
      <line x1="41" y1="25" x2="45" y2="25"/>
    </g>
  </g>
  <!-- nó saida 1 -->
  <g transform="translate(170,130)">
    <rect width="60" height="40" rx="10" fill="#0f1521" stroke="#F5B942" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="12" rx="2" fill="none" stroke="#F5B942" stroke-width="1.5"/>
    <line x1="16" y1="20" x2="44" y2="20" stroke="#F5B942" stroke-width="1"/>
  </g>
  <!-- nó saida 2 -->
  <g transform="translate(280,130)">
    <rect width="60" height="40" rx="10" fill="#0f1521" stroke="#4FD1C5" stroke-width="1.5"/>
    <path d="M18,22 l7,7 l17,-17" fill="none" stroke="#4FD1C5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- resultado final -->
  <g transform="translate(150,205)">
    <rect width="100" height="34" rx="8" fill="#0f1521" stroke="#3a4560"/>
    <text x="50" y="21" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9AA5B8" text-anchor="middle">planilha.xlsx</text>
  </g>
  <g transform="translate(260,205)">
    <rect width="100" height="34" rx="8" fill="#0f1521" stroke="#3a4560"/>
    <text x="50" y="21" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9AA5B8" text-anchor="middle">e-mail enviado</text>
  </g>
</svg>
